services:
  - type: web
    name: backyard-golf-rooms
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /healthz
    envVars:
      - key: CLIENT_ORIGIN
        value: https://thevalleydev.github.io
